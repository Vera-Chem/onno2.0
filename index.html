<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>氧了个氧 · 氧化数消消乐</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23FFFDF8' stroke='%23463757' stroke-width='4'/%3E%3Ccircle cx='22' cy='28' r='4' fill='%23463757'/%3E%3Ccircle cx='42' cy='28' r='4' fill='%23463757'/%3E%3Cpath d='M24 41q8 7 16 0' stroke='%23463757' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=ZCOOL+KuaiLe&family=Baloo+2:wght@600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  --ink:#463757; --ink-2:#6F5C82; --cream:#FFF7EC; --paper:#FFFDF8;
  --mint:#A8E5C6; --peach:#FFB79F; --butter:#FFDC8B; --lav:#CBB9F2; --sky:#A9D9F2; --pink:#FFB2C8;
  --accent:#A8E5C6; --accent-ink:#2E8A63;
  --f-display:"ZCOOL KuaiLe","Noto Sans SC","PingFang SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  --f-num:"Baloo 2","Noto Sans SC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:var(--f-body); color:var(--ink); background:var(--cream);
  background-image:radial-gradient(rgba(70,55,87,.075) 1.5px,transparent 1.6px);
  background-size:22px 22px;
  overflow:hidden; -webkit-tap-highlight-color:transparent; user-select:none;
  -webkit-text-size-adjust:100%;
}
body[data-lv="1"]{--accent:var(--mint);--accent-ink:#2E8A63}
body[data-lv="2"]{--accent:var(--peach);--accent-ink:#B85137}
body[data-lv="3"]{--accent:var(--lav);--accent-ink:#5F45A0}

.app{height:100vh; height:100dvh; display:flex; flex-direction:column;
  padding:0 0 calc(8px + env(safe-area-inset-bottom)); position:relative;}

/* ===== 主界面 / 模式 ===== */
.home{position:fixed; inset:0; z-index:55; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  padding:22px 20px calc(22px + env(safe-area-inset-bottom));
  background-color:#FFF3E3;
  background-image:radial-gradient(circle at 50% -12%, #FFFDF6 0%, rgba(255,253,246,0) 62%),
    radial-gradient(rgba(70,55,87,.085) 1.5px, transparent 1.6px);
  background-size:100% 100%, 20px 20px}
.home.show{display:flex}
.home::before{content:""; position:absolute; left:50%; top:-110px; width:540px; height:540px; transform:translateX(-50%);
  background:radial-gradient(circle, rgba(255,183,159,.26) 0%, rgba(255,183,159,0) 66%); pointer-events:none}
.home::after{content:""; position:absolute; left:-130px; bottom:-150px; width:430px; height:430px;
  background:radial-gradient(circle, rgba(168,229,198,.32) 0%, rgba(168,229,198,0) 68%); pointer-events:none}
.home > *{position:relative; z-index:1}
.home-brand{display:flex; flex-direction:column; align-items:center; gap:7px}
.home-brand .ava{width:62px; height:62px}
.home-brand h1{font-family:var(--f-display); font-weight:400; font-size:31px; line-height:1.1; margin:0; letter-spacing:1px}
.home-brand p{margin:0; font-size:11px; color:var(--ink-2); letter-spacing:.5px}
.home-inner{width:min(100%,348px); display:flex; flex-direction:column; gap:10px}
.mode-card{display:flex; align-items:center; gap:12px; width:100%; text-align:left; font-family:inherit; color:inherit;
  padding:13px 14px; border:2.5px solid var(--ink); border-radius:20px; background:var(--paper);
  box-shadow:0 6px 0 rgba(70,55,87,.16); cursor:pointer; transition:transform .12s, box-shadow .12s}
.mode-card:active{transform:translateY(3px); box-shadow:0 3px 0 rgba(70,55,87,.16)}
.mode-ic{width:44px; height:44px; flex:0 0 auto; border:2px solid var(--ink); border-radius:14px; display:grid; place-items:center}
.mode-ic svg{width:22px; height:22px}
.home-inner .mode-card[data-act="mode-challenge"] .mode-ic{background:var(--peach)}
.home-inner .mode-card[data-act="mode-practice"] .mode-ic{background:var(--mint)}
.mode-tx{min-width:0; flex:1}
.mode-tx b{display:block; font-family:var(--f-display); font-weight:400; font-size:16.5px; letter-spacing:.6px}
.mode-tx i{display:block; font-style:normal; font-size:10.5px; line-height:1.5; color:var(--ink-2); margin-top:3px}
.home-best{margin:1px 0 0; min-height:15px; text-align:center; font-size:11px; color:var(--ink-2); letter-spacing:.3px}
.home-tips{display:flex; flex-direction:column; gap:5px; padding:9px 12px;
  background:rgba(255,253,248,.86); border:2px dashed rgba(70,55,87,.2); border-radius:16px}
.home-tips p{margin:0; display:flex; align-items:center; gap:7px; font-size:10.5px; line-height:1.45; color:var(--ink-2); white-space:nowrap}
.home-tips span{flex:0 0 auto; width:15px; height:15px; border-radius:50%; border:1.5px solid var(--ink);
  background:var(--butter); display:grid; place-items:center; font-family:var(--f-num); font-size:9.5px; font-weight:800; color:var(--ink)}
.home-foot{display:flex; gap:8px; justify-content:center}
.home-sign{display:flex; align-items:center; gap:6px; font-size:10.5px; font-weight:600; color:var(--ink-2)}
.home-sign .ava{width:24px; height:24px}
.ghost-btn{border:2px solid var(--ink); background:rgba(255,253,248,.92); color:var(--ink); border-radius:999px;
  font-family:inherit; font-size:11px; font-weight:700; padding:5px 13px; cursor:pointer; box-shadow:0 3px 0 rgba(70,55,87,.14)}
.ghost-btn:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(70,55,87,.14)}

/* 提示气泡 */
.toast{position:fixed; left:50%; bottom:calc(196px + env(safe-area-inset-bottom)); transform:translate(-50%,10px);
  max-width:84vw; text-align:center; background:var(--ink); color:#FFF8EC; font-size:11.5px; font-weight:700; line-height:1.4;
  padding:7px 14px; border-radius:999px; box-shadow:0 4px 0 rgba(70,55,87,.22);
  opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; z-index:62}
.toast.show{opacity:1; transform:translate(-50%,0)}

/* 锁住的关卡 */
.tab.locked{opacity:.5; background:#F3E9D9}
.tab.locked svg{width:11px; height:11px; vertical-align:-1px; margin-right:3px}

/* 暂停 */
.pause{position:fixed; inset:0; z-index:58; display:none; flex-direction:column; align-items:center; justify-content:center; gap:12px;
  padding:24px; background-color:#FFF3E3;
  background-image:radial-gradient(circle at 50% 0%, #FFFDF6 0%, rgba(255,253,246,0) 60%),
    radial-gradient(rgba(70,55,87,.085) 1.5px, transparent 1.6px);
  background-size:100% 100%, 20px 20px}
.pause.show{display:flex}
.pause-inner{width:min(100%,320px); display:flex; flex-direction:column; align-items:center; gap:9px;
  padding:24px 20px 20px; background:var(--paper); border:2.5px solid var(--ink); border-radius:22px; box-shadow:0 8px 0 rgba(70,55,87,.16)}
.pause-ic{width:52px; height:52px; border-radius:50%; border:2.5px solid var(--ink); background:var(--sky); display:grid; place-items:center}
.pause-ic svg{width:22px; height:22px}
.pause-inner h2{font-family:var(--f-display); font-weight:400; font-size:21px; margin:0}
.pause-sub{margin:1px 0 0; font-size:14px; font-weight:700; color:var(--ink); text-align:center; line-height:1.4; letter-spacing:.5px}
.pause-time{font-family:var(--f-num); font-size:12px; font-weight:800; color:var(--ink); background:var(--butter);
  border:1.5px solid var(--ink); border-radius:9px; padding:2px 10px}
.pause-inner .btn-main{width:100%}

/* 挑战计时 */
.progress .clk{display:block; margin-top:1px}
.pausechip{display:inline-flex; align-items:center; gap:3px; padding:1px 5px; border:1.5px solid var(--ink); border-radius:8px;
  background:var(--paper); color:var(--ink); font-family:var(--f-num); box-shadow:0 2px 0 rgba(70,55,87,.16); cursor:pointer}
.pausechip svg{width:11px; height:11px; stroke:currentColor; stroke-width:3; stroke-linecap:round; fill:none}

/* 挑战结算 */
.card.fin{overflow:hidden}
.card.fin::after{content:""; position:absolute; top:-55%; left:-45%; width:55%; height:210%;
  background:linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.75) 50%, rgba(255,255,255,0) 100%);
  transform:rotate(14deg); animation:shine 1s ease-out .4s both; pointer-events:none}
@keyframes shine{0%{left:-55%; opacity:.85}100%{left:125%; opacity:0}}
.fin-medal{display:block; width:94px; margin:-4px auto 2px; animation:medalPop .6s cubic-bezier(.2,1.5,.4,1) both}
@keyframes medalPop{0%{transform:scale(.6) rotate(-11deg); opacity:0}62%{transform:scale(1.07) rotate(3deg); opacity:1}100%{transform:scale(1) rotate(0)}}
.big-time{display:table; font-family:var(--f-num); font-weight:800; font-size:36px; line-height:1.2; text-align:center; margin:1px auto 0; letter-spacing:1px; padding:0 8px;
  background:linear-gradient(transparent 64%, var(--butter) 64%)}
.fin-row{display:flex; justify-content:space-between; gap:10px; margin:0; font-size:11.5px; color:var(--ink-2)}
.fin-row b{font-family:var(--f-num); font-weight:800; color:var(--ink)}
.new-rec{text-align:center; font-size:11px; font-weight:700; color:var(--accent-ink); margin:3px 0 0}

/* ===== 顶栏 ===== */
.top{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 16px 2px}
.brand{display:flex; align-items:center; gap:9px; min-width:0}
.mascot{width:44px; flex:0 0 auto}
.mascot svg{display:block; width:100%; height:auto}
.brand-txt{min-width:0}
h1{font-family:var(--f-display); font-weight:400; font-size:25px; line-height:1.1; margin:0; letter-spacing:.5px}
.sub{margin:3px 0 0; font-size:10.5px; color:var(--ink-2); font-weight:500}
.top-actions{display:flex; gap:6px; flex:0 0 auto}
.icon-btn{width:34px; height:34px; border-radius:50%; border:2px solid var(--ink); background:var(--paper);
  display:grid; place-items:center; color:var(--ink); cursor:pointer; padding:0;
  box-shadow:0 3px 0 rgba(70,55,87,.16); transition:transform .12s, box-shadow .12s}
.icon-btn:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(70,55,87,.16)}
.icon-btn svg{width:17px; height:17px}
.icon-btn.off{opacity:.45}

/* ===== 关卡与目标 ===== */
.hud{padding:8px 16px 0; display:flex; flex-direction:column; gap:6px}
.tabs{display:flex; gap:6px}
.tab{border:2px solid var(--ink); background:var(--paper); color:var(--ink); border-radius:999px;
  font-family:var(--f-body); font-size:12px; font-weight:700; padding:4px 11px; cursor:pointer;
  box-shadow:0 3px 0 rgba(70,55,87,.14); transition:transform .12s, box-shadow .12s, background .16s}
.tab:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(70,55,87,.14)}
.tab.on{background:var(--accent); box-shadow:0 3px 0 rgba(70,55,87,.28)}
.vrow{display:flex; align-items:center; gap:7px; min-width:0}
.vrow-label{font-size:10.5px; color:var(--ink-2); font-weight:500; flex:0 0 auto}
.vchips{display:flex; gap:4px; flex-wrap:wrap; min-width:0}
.vchip{font-family:var(--f-num); font-weight:800; font-size:12px; line-height:1; background:#fff;
  border:1.5px solid rgba(70,55,87,.24); border-radius:999px; padding:3px 7px 2px; color:var(--ink)}
.vchip.hit{background:var(--butter); border-color:var(--ink)}

/* ===== 牌堆 ===== */
.stage{flex:1 1 0; min-height:0; display:flex; align-items:center; justify-content:center; padding:8px 10px 84px}
.board{position:relative; flex:0 0 auto}
.board.in{animation:boardIn .32s cubic-bezier(.2,.8,.3,1) both}
@keyframes boardIn{from{opacity:.3; transform:translateY(8px) scale(.988)} to{opacity:1; transform:none}}
.board::before{content:""; position:absolute; inset:-9px -4px; border-radius:26px;
  background-color:rgba(255,253,247,.88);
  background-image:radial-gradient(rgba(70,55,87,.08) 1.4px, transparent 1.5px);
  background-size:16px 16px;
  box-shadow:inset 0 0 0 2px rgba(70,55,87,.09), 0 4px 0 rgba(70,55,87,.06); z-index:0}
.tile{position:absolute; width:calc(var(--s) * .96); height:calc(var(--s) * 1.16);
  border-radius:calc(var(--s) * .19); border:2px solid var(--ink); background:var(--paper);
  box-shadow:0 4px 0 rgba(70,55,87,.20), inset 0 -3px 0 rgba(70,55,87,.05);
  display:flex; align-items:center; justify-content:center; cursor:pointer; padding:1px;
  transition:transform .14s ease, opacity .16s ease, filter .16s ease; will-change:transform}
.tile:hover{transform:translateY(-2px)}
.tile.blocked{background:#F2EBDD; border-color:#83739A; box-shadow:none; cursor:default}
.tile.blocked .tile-fml{color:#A08FB4}
.tile.blocked .tile-el{opacity:.45}
.tile.blocked:hover{transform:none}
.tile.off{display:none}
.tile.shake{animation:shake .28s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.tile.poke{animation:poke .4s}
@keyframes poke{0%{transform:scale(1)}45%{transform:scale(1.09)}100%{transform:scale(1)}}
.tile-el{position:absolute; top:calc(var(--s) * .05); left:calc(var(--s) * .065);
  font-family:var(--f-num); font-weight:800; font-size:calc(var(--s) * .155); line-height:1;
  padding:calc(var(--s) * .028) calc(var(--s) * .048); border-radius:999px;
  border:1.5px solid rgba(70,55,87,.45); color:var(--ink)}
.tile-fml{font-family:var(--f-num); font-weight:800; font-size:calc(var(--s) * .255); line-height:1;
  letter-spacing:0; text-align:center; white-space:nowrap}
.tile-fml.long{font-size:calc(var(--s) * .215); letter-spacing:-.02em}
.tile-val{position:absolute; right:calc(var(--s) * .06); bottom:calc(var(--s) * .05);
  font-family:var(--f-num); font-weight:800; font-size:calc(var(--s) * .19); line-height:1;
  color:var(--accent-ink)}
.tg{background:var(--butter); border-radius:.22em; padding:0 .1em; font-weight:800}
sub{font-size:.66em; vertical-align:-.22em; font-weight:700}
sup{font-size:.62em; vertical-align:.42em; font-weight:700}

/* ===== 槽位 ===== */
.traybar{flex:0 0 auto; padding:6px 14px 0; display:flex; flex-direction:column; gap:4px}
.tray{display:flex; gap:4px; justify-content:center}
.slot{flex:1 1 0; min-width:0; max-width:54px; aspect-ratio:1 / 1.2; border-radius:11px;
  border:2px dashed rgba(70,55,87,.22); background:rgba(255,255,255,.55);
  display:flex; align-items:center; justify-content:center; padding:0; overflow:hidden}
.slot.filled{border:2px solid var(--ink); background:var(--paper); border-style:solid;
  box-shadow:0 3px 0 rgba(70,55,87,.18)}
.slot.pop{animation:pop .26s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.55) translateY(-8px); opacity:.3}100%{transform:scale(1) translateY(0); opacity:1}}
.slot.matched{animation:cleared .38s ease forwards; background:var(--butter)}
@keyframes cleared{0%{transform:scale(1)}40%{transform:scale(1.14) rotate(-4deg)}100%{transform:scale(.4) rotate(6deg); opacity:0}}
.mini-fml{font-family:var(--f-num); font-weight:800; font-size:clamp(9px,3.1vw,13px); line-height:1;
  text-align:center; white-space:nowrap}

/* ===== 道具 ===== */
.tools{flex:0 0 auto; display:flex; align-items:center; gap:6px; padding:8px 14px 16px}
.btn{display:inline-flex; align-items:center; gap:4px; border:2px solid var(--ink); background:var(--paper);
  color:var(--ink); border-radius:999px; padding:5px 10px; font-family:var(--f-body); font-size:11.5px;
  font-weight:700; cursor:pointer; box-shadow:0 3px 0 rgba(70,55,87,.16);
  transition:transform .12s, box-shadow .12s, opacity .16s}
.btn:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(70,55,87,.16)}
.btn svg{width:14px; height:14px}
.btn .cnt{font-family:var(--f-num); font-weight:800; font-size:10px; background:var(--accent);
  border-radius:999px; padding:1px 5px; line-height:1.3}
.btn[data-tool="hint"]{background:var(--butter)}
.btn[data-tool="undo"]{background:var(--mint)}
.btn[data-tool="shuffle"]{background:var(--sky)}
.btn .cnt{background:rgba(255,255,255,.8); border:1px solid rgba(70,55,87,.35)}
.btn[disabled]{opacity:.38; box-shadow:none; transform:translateY(2px)}
.progress{flex:0 0 76px; margin-left:auto; font-size:10.5px; color:var(--ink-2); font-weight:500; text-align:right; line-height:1.4; white-space:nowrap}
.progress b{font-family:var(--f-num); font-weight:800; font-size:13px; color:var(--ink)}

/* ===== 消除笔记卡（停在棋盘与槽位之间的留白里，不压牌） ===== */
.note{position:fixed; left:50%; top:0; transform:translate(-50%,8px);
  width:min(92vw,430px); background:var(--paper); border:2px solid var(--ink); border-radius:14px;
  box-shadow:0 5px 0 rgba(70,55,87,.15); padding:5px 10px 6px; z-index:30;
  opacity:0; pointer-events:none; transition:opacity .16s, transform .16s}
.note.show{opacity:1; transform:translate(-50%,0)}
.note-head{display:flex; align-items:center; gap:6px; font-size:10.5px; font-weight:700}
.note-val{font-family:var(--f-num); font-weight:800; font-size:12.5px; background:var(--butter);
  border:1.5px solid var(--ink); border-radius:7px; padding:0 6px; line-height:1.4}
.note-row{display:flex; align-items:baseline; gap:6px; font-family:var(--f-num);
  font-size:10px; line-height:1.42; color:var(--ink-2); padding-top:2px}
.note-q{font-weight:800; color:var(--ink); white-space:nowrap}
.note-w{font-weight:600; white-space:nowrap}

/* ===== 遮罩弹层 ===== */
.fx{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:65; display:none}
.fx.on{display:block}
.overlay{position:fixed; inset:0; background:rgba(70,55,87,.38); display:none;
  align-items:center; justify-content:center; padding:18px; z-index:60}
.overlay.show{display:flex}
.card{background:var(--paper); border:2.5px solid var(--ink); border-radius:22px;
  box-shadow:0 10px 0 rgba(70,55,87,.22); padding:18px 18px 16px; width:100%; max-width:390px;
  max-height:88vh; overflow:auto; animation:cardIn .44s cubic-bezier(.3,1.55,.55,1) both}
@keyframes cardIn{0%{transform:scale(.86) translateY(14px); opacity:0}60%{transform:scale(1.02) translateY(0); opacity:1}100%{transform:scale(1) translateY(0)}}
.card h2{font-family:var(--f-display); font-weight:400; font-size:22px; margin:0 0 4px; letter-spacing:.5px}
.card-sub{margin:0 0 12px; font-size:11px; color:var(--ink-2); font-weight:500}
.rule-list{margin:0 0 12px; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px}
.rule-list li{display:flex; gap:8px; font-size:12.5px; line-height:1.5}
.rule-list li i{font-family:var(--f-num); font-weight:800; font-style:normal; width:19px; height:19px;
  flex:0 0 auto; border-radius:50%; background:var(--accent); border:1.5px solid var(--ink);
  display:grid; place-items:center; font-size:11px; margin-top:2px}
.panelbox{background:rgba(255,255,255,.75); border:1.5px dashed rgba(70,55,87,.3);
  border-radius:14px; padding:10px 12px; margin:0 0 12px}
.panelbox h3{margin:0 0 6px; font-size:11.5px; font-weight:700; color:var(--ink)}
.panelbox p{margin:0 0 5px; font-size:11.5px; line-height:1.55; color:var(--ink-2)}
.panelbox p:last-child{margin-bottom:0}
.panelbox b{color:var(--ink); font-family:var(--f-num); font-weight:700}
.card-actions{display:flex; gap:8px; margin-top:2px}
.btn-main{flex:1; justify-content:center; background:var(--accent); padding:9px 12px; font-size:13px}
.card h2 .hl{background:var(--butter); border-radius:.3em; padding:0 .18em}

/* ===== 小屏微调 ===== */
@media (max-height:660px){
  h1{font-size:21px}
  .mascot{width:36px}
  .hud{gap:4px; padding-top:5px}
  .tools{padding-bottom:8px}
  .note-row{padding:1px 0}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important; transition:none !important}
}

/* ===== 皮肤 v2：更软更萌 ===== */
body{background-color:#FFF3E1}
body::before,body::after{content:""; position:fixed; border-radius:50%; pointer-events:none; z-index:0}
body::before{width:240px; height:240px; background:var(--mint); opacity:.18; top:-120px; right:-86px}
body::after{width:210px; height:210px; background:var(--peach); opacity:.15; bottom:-100px; left:-86px}
.app{z-index:1}

h1{display:inline-block; padding:0 1px 2px;
  background-image:linear-gradient(transparent 60%, rgba(255,220,139,.9) 60%, rgba(255,220,139,.9) 94%, transparent 94%);
  background-repeat:no-repeat; background-size:100% 100%}
.mascot{animation:floaty 3.6s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-4px) rotate(2deg)}}

.board::before{border-radius:30px; background-color:#FFFBF1;
  background-image:radial-gradient(rgba(110,84,128,.10) 1.4px, transparent 1.5px); background-size:17px 17px;
  box-shadow:inset 0 0 0 2px rgba(110,84,128,.13), 0 6px 0 rgba(110,84,128,.07)}
.board::after{content:""; position:absolute; top:-15px; right:17%; width:62px; height:17px;
  background:rgba(168,229,198,.82); border-radius:4px; transform:rotate(-5deg);
  box-shadow:0 2px 0 rgba(70,55,87,.10); z-index:1}

.tile{border-radius:calc(var(--s) * .21); border-color:#54415F;
  box-shadow:0 4px 0 rgba(84,65,95,.22), inset 0 2px 0 rgba(255,255,255,.92), inset 0 -4px 0 rgba(84,65,95,.05)}
.tile.blocked{background:#F5EEDF; border-color:#9B8CB0}

.peek{position:absolute; left:calc(var(--s) * .02); top:calc(100% + 8px);
  width:calc(var(--s) * .56); z-index:5; pointer-events:none}
.peek svg{display:block; width:100%; height:auto}
@media (max-height:770px){.peek{display:none}}

.tray{background:rgba(255,255,255,.5); border:1.5px solid rgba(84,65,95,.14);
  border-radius:18px; padding:5px 6px}

.card{box-shadow:inset 0 6px 0 var(--accent), 0 10px 0 rgba(84,65,95,.22);
  scrollbar-width:none}
.card::-webkit-scrollbar{width:0; height:0}
.card h2{margin-top:6px}
.card-sign{display:flex; align-items:center; justify-content:center; gap:4px;
  margin-top:10px; padding-top:9px; border-top:1.5px dashed rgba(84,65,95,.2);
  font-family:var(--f-num); font-weight:700; font-size:10.5px; color:var(--ink-2); letter-spacing:.4px; opacity:.85}
.card-sign svg{width:12px; height:12px; flex:0 0 auto}

.top-actions{flex-direction:column; align-items:flex-end; gap:6px}
.top-actions .icons{display:flex; gap:6px}
.vera{display:flex; align-items:center; gap:4px; padding:2px 8px 2px 6px;
  border-radius:999px; background:rgba(255,252,244,.92);
  border:1.2px dashed rgba(84,65,95,.34); transform:rotate(-2deg);
  box-shadow:0 2px 0 rgba(84,65,95,.06); white-space:nowrap}
.vera .chili{width:13px; height:13px; flex:0 0 auto}
.vera .cn{font-family:var(--f-display); font-size:10.5px; color:#6A5578; letter-spacing:.4px}
.vera .en{font-family:var(--f-num); font-style:italic; font-weight:700; font-size:10.5px; color:var(--accent-ink)}

.btn{white-space:nowrap}
@media (max-width:380px){
  .btn{padding:5px 7px; font-size:11px}
  .btn .cnt{font-size:9.5px}
  .progress{flex:0 0 64px; font-size:10px}
  h1{font-size:23px}
  .vera{padding:2px 6px 2px 5px}
  .mascot,.ava-lg{width:40px; height:40px}
  .sub{font-size:9px; white-space:nowrap}
}

.mascot{width:46px}
.ava{position:relative; display:inline-block; flex:0 0 auto; border-radius:50%;
  border:2.5px solid #FFFDF8; background-color:#FFFDF8; overflow:hidden;
  box-shadow:0 3px 0 rgba(84,65,95,.16), 0 0 0 1.6px rgba(84,65,95,.16)}
.ava-lg{width:46px; height:46px}
.ava-md{width:38px; height:38px; border-width:2px;

.ava-sm{width:16px; height:16px; border-width:1.5px;

    return pick(function (s) { return s.t === tier; })

      .concat(pick(function (s) { return Math.abs(s.t - tier) === 2; }));
  }

  function buildLevel(lvIdx) {
    var L = LEVELS[lvIdx], tiles = [], id = 0;

    L.layers.forEach(function (cfg, li) {
      var cells = [];
      for (var r = 0; r < cfg.rows; r++) {
        for (var c = 0; c < cfg.cols; c++) cells.push({ x: cfg.ox + c, y: cfg.oy + r * 1.15 });
      }
      shuffleArr(cells);
      for (var k = 0; k < cfg.count && k < cells.length; k++) {
        tiles.push({
          id: ++id, layer: li, x: cells[k].x, y: cells[k].y,
          inTray: false, removed: false, revealed: false,
          v: 0, sym: '', q: '', cg: '', w: '', node: null
        });
      }
    });

    /* 每个化合价按关卡难度取若干组三连；同关内不出现重复物质 */
    var G = L.groups || 2;
    var triples = [];
    L.values.forEach(function (v) {
      var pool = poolFor(v, L.t || 1);
      var need = G * 3, base = pool.slice();
      if (base.length < need) {
        for (var k = 0; base.length < need && pool.length; k++) base.push(pool[k % pool.length]);
      }
      for (var g = 0; g < G; g++) {
        var sp = base.slice(g * 3, g * 3 + 3);
        if (sp.length === 3 && (sp[0] === sp[1] || sp[1] === sp[2] || sp[0] === sp[2])) {
          sp = [pool[g % pool.length], pool[(g + 1) % pool.length], pool[(g + 2) % pool.length]];
        }
        triples.push({ v: v, sp: sp });
      }
    });
    shuffleArr(triples);

    var order = tiles.slice().sort(function (a, b) { return b.layer - a.layer; });
    order.forEach(function (t, i) {

      t.v = sp.v; t.sym = sp.el; t.q = sp.q; t.cg = sp.cg; t.w = sp.w;
    });

    tiles.forEach(function (t) { maxX = Math.max(maxX, t.x + 1); maxY = Math.max(maxY, t.y + 1.2); });

        '<div class="card fin">' +
        MEDAL_HTML +
        '<h2>三关全通！</h2>' +
        '<p class="card-sub">挑战模式 · 总用时</p>' +
        '<p class="big-time">' + fmtTime(total) + '</p>' +
        (isNew
          ? '<p class="new-rec">' + (best ? '新纪录 · 快了 ' + fmtTime(Math.max(0, best - total)) : '首次挑战记录') + '</p>'
          : '<p class="card-sub" style="text-align:center">最佳记录 ' + fmtTime(best) + '</p>') +
        '<div class="panelbox"><h3>分关用时</h3>' + rows + '</div>' +
        '<div class="card-actions">' +
        '<button class="btn btn-main" data-act="chal-again">再挑战一次</button>' +
        '<button class="btn" data-act="home">回主界面</button>' +
        '</div>' + SIGN + '</div>';
      overlay.classList.add('show');
      CF.grand();
      renderClock();
      return;
    }
    overlay.innerHTML =
      '<div class="card">' +
      '<h2>全部消完，通关！</h2>' +
      '<p class="card-sub">第 ' + LEVELS[state.lv].key + ' 关 · ' + LEVELS[state.lv].name + ' · 消除 ' + state.done + ' 组</p>' +
      '<div class="panelbox">' +
      '<h3>带走这条口诀</h3>' +
      '<p>化合物里各元素化合价代数和为 0；多原子离子里代数和等于离子电荷。</p>' +
      '</div>' +
      '<div class="card-actions">' +
      (next < LEVELS.length
        ? '<button class="btn btn-main" data-act="next">挑战第 ' + LEVELS[next].key + ' 关</button>'
        : '<button class="btn btn-main" data-act="retry">再玩一遍</button>') +
      '<button class="btn" data-act="home">回主界面</button>' +
      '</div>' + SIGN + '</div>';
    overlay.classList.add('show');
    CF.fire(next >= LEVELS.length);
  }

  /* ---------- 开局 ---------- */
  function startLevel(i) {
    state.lv = i;
    state.chal.lvT0 = Date.now();
    state.chal.paused = false;
    var pz1 = document.getElementById('pause');
    if (pz1) pz1.classList.remove('show');
    state.over = false; state.lock = false;
    state.done = 0; state.tray = [];
    state.hints = 3; state.undos = 2; state.shuffles = 1;
    state.noteTimer && clearTimeout(state.noteTimer);
    noteEl.classList.remove('show');
    document.body.setAttribute('data-lv', LEVELS[i].key);

    var built = buildLevel(i);
    state.tiles = built.tiles;
    state.W = built.W; state.H = built.H;
    state.total = LEVELS[i].values.length * (LEVELS[i].groups || 2);

    renderBoard();
    var bd = document.getElementById('board');
    if (bd) { bd.classList.remove('in'); void bd.offsetWidth; bd.classList.add('in'); }
    renderTabs();
    renderTray();
    doLayout();
    updateBlocked();
    updateHud();
    closeOverlay();
    CF.clear();
    renderClock();
  }

  /* 头像：纯 CSS 方块拼成的像素画，不依赖图片/SVG/canvas；外链图若能加载则覆盖 */
  var AVA_SRC = 'https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/O4N7bMhvKoYpSfxG6dzcTbEbneh';

  function syncAva() {
    var hero = document.getElementById('avaHeroPx');
    if (hero) {
      var inner = hero.innerHTML;
      var boxes = document.querySelectorAll('.px');
      for (var i = 0; i < boxes.length; i++) {
        if (boxes[i] === hero || boxes[i].childNodes.length) continue;
        boxes[i].innerHTML = inner;
      }
    }
    var imgs = document.querySelectorAll('img.ava-img');
    for (var j = 0; j < imgs.length; j++) {
      var im = imgs[j];
      if (im.getAttribute('data-load')) continue;
      im.setAttribute('data-load', '1');
      im.addEventListener('error', function () { this.style.visibility = 'hidden'; });
      im.src = AVA_SRC;
    }
  }

  if (window.MutationObserver) {
    new MutationObserver(syncAva).observe(overlay, { childList: true });
  }

  var SIGN = '<div class="card-sign">' +
    '<span class="ava ava-sm"><div class="px" aria-hidden="true"></div><img class="ava-img" alt=""></span>' +
    '<span>微辣化学 Vera</span></div>';

  var PEEK_SVG = '<svg viewBox="0 0 100 86" aria-hidden="true">' +
    '<g fill="#FFFDF8" stroke="#54415F" stroke-width="3.2" stroke-linejoin="round">' +
    '<circle cx="30" cy="47" r="16.5"/><circle cx="50" cy="32" r="18"/>' +
    '<circle cx="70" cy="47" r="16.5"/><circle cx="50" cy="54" r="16.5"/></g>' +
    '<circle cx="41" cy="44" r="3.1" fill="#54415F"/><circle cx="59" cy="44" r="3.1" fill="#54415F"/>' +
    '<ellipse cx="33" cy="51.5" rx="4.6" ry="2.7" fill="#FFB2C8" opacity=".8"/>' +
    '<ellipse cx="67" cy="51.5" rx="4.6" ry="2.7" fill="#FFB2C8" opacity=".8"/>' +
    '<path d="M46.5 51q3.5 3.6 7 0" fill="none" stroke="#54415F" stroke-width="2.3" stroke-linecap="round"/></svg>';

  var RULES_HTML =
    '<div class="panelbox">' +
    '<h3>算化合价的口诀</h3>' +
    '<p><b>1</b>&nbsp;单质中元素化合价 = 0。</p>' +
    '<p><b>2</b>&nbsp;单原子离子 = 所带电荷，如 Fe<sup>3+</sup> 为 +3。</p>' +
    '<p><b>3</b>&nbsp;O 通常 −2，但 H<sub>2</sub>O<sub>2</sub> 中为 −1，OF<sub>2</sub> 中为 +2。</p>' +
    '<p><b>4</b>&nbsp;H 通常 +1，但与金属成键的氢化物（NaH、LiAlH<sub>4</sub>）中为 −1。</p>' +
    '<p><b>5</b>&nbsp;化合物中各元素代数和 = 0；多原子离子中各元素代数和 = 离子电荷。</p>' +
    '<p><b>6</b>&nbsp;名称里的罗马数字就是氧化数：KMnO<sub>4</sub> 读作 manganate(VII)，Mn 为 +7。</p>' +
    '</div>';

  function showIntro() {
    overlay.innerHTML =
      '<div class="card">' +
      '<div class="card-head"><span class="ava ava-md"><div class="px" aria-hidden="true"></div><img class="ava-img" alt=""></span><h2>氧了个氧</h2></div>' +
      '<p class="card-sub">氧化数消消乐 · oxidation number</p>' +
      '<ul class="rule-list">' +
      '<li><i>1</i><span>点一张牌，它就滑进下方槽位（共 7 格）。</span></li>' +
      '<li><i>2</i><span>三张牌上<b>目标元素的化合价相同</b>就消除 —— 不必是同一物质，牌面也不给答案。</span></li>' +
      '<li><i>3</i><span>槽位塞满 7 格还凑不出三连，本局结束。</span></li>' +
      '</ul>' +
      RULES_HTML +
      '<div class="card-actions"><button class="btn btn-main" data-act="start">开始第 1 关</button></div>' + SIGN +
      '</div>';
    overlay.classList.add('show');
  }

  /* ---------- 事件 ---------- */
  overlay.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'start') startLevel(0);
    else if (act === 'retry') startLevel(state.lv);
    else if (act === 'next') startLevel(state.lv + 1);
    else if (act === 'tabs') { closeOverlay(); }
    else if (act === 'home') { showHome(); }
    else if (act === 'chal-again') { startMode('challenge'); }
    else if (act === 'rules') { showRules(); }
    else if (act === 'close') { closeOverlay(); }
  });

  document.querySelectorAll('.tools .btn').forEach(function (b) {
    b.addEventListener('click', function () {
      var tool = b.getAttribute('data-tool');
      if (tool === 'hint') useHint();
      else if (tool === 'undo') useUndo();
      else if (tool === 'shuffle') useShuffle();
    });
  });

  document.getElementById('btnSound').addEventListener('click', function () {
    state.sound = !state.sound;
    this.classList.toggle('off', !state.sound);
    if (state.sound) sfx('pick');
  });

  function showRules() {
    overlay.innerHTML =
      '<div class="card">' +
      '<h2>化合价口诀卡</h2>' +
      '<p class="card-sub">calculate oxidation numbers of elements in compounds and ions</p>' +
      RULES_HTML +
      '<div class="panelbox"><h3>做题顺序</h3>' +
      '<p>先写出已知元素的化合价，设目标元素为 <b>x</b>，按“代数和 = 0 或离子电荷”列方程，解出 x。</p></div>' +
      '<div class="card-actions"><button class="btn btn-main" data-act="close">知道啦</button>' +
      '<button class="btn" data-act="home">回主界面</button></div>' + SIGN +
      '</div>';
    overlay.classList.add('show');
  }
  document.getElementById('btnRules').addEventListener('click', showRules);

  if (overlay) {
    overlay.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('[data-act="close"]') : null;
      if (b) closeOverlay();
    });
  }

  window.addEventListener('resize', function () { doLayout(); });
  if (window.ResizeObserver) { new ResizeObserver(function () { doLayout(); }).observe(stage); }
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(function () { doLayout(); }); }
  window.addEventListener('orientationchange', function () { setTimeout(doLayout, 260); });

  /* ---------- 启动 ---------- */
  syncAva();
  startLevel(0);
  showHome();

  document.getElementById('btnHome').addEventListener('click', function () { sfx('pick'); showHome(); });
  document.getElementById('btnPause').addEventListener('click', function () { sfx('pick'); pauseGame(); });
  document.getElementById('btnResume').addEventListener('click', function () { sfx('pick'); resumeGame(); });
  document.getElementById('btnPauseHome').addEventListener('click', function () { sfx('pick'); showHome(); });
  document.getElementById('home').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'mode-challenge') startMode('challenge');
    else if (act === 'mode-practice') startMode('practice');
    else if (act === 'rules') showRules();
    else if (act === 'sound') { document.getElementById('btnSound').click(); updateBest(); }
  });
})();
</script>
</body>
</html>
